              {
                "@type": "Question",
                "name": "Does Google NotebookLM have captions or subtitles?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Google NotebookLM ships no closed captions and no timed text track for Video Overviews or Audio Overviews. LM Subs generates captions in your browser from the audio-only stream and renders them inside the player, with export to SRT, VTT, TXT, MD, CSV, and JSON."
                }
              },
              {
                "@type": "Question",
                "name": "Is LM Subs free to use?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The extension is free and MIT licensed. You bring your own speech-to-text API key, and the two recommended providers, Groq and Mistral, both offer permanent free tiers with no credit card. You can also point LM Subs at a local Whisper server and pay nothing."
                }
              },
              {
                "@type": "Question",
                "name": "Does LM Subs upload my NotebookLM videos anywhere?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Audio extraction happens entirely in the browser, and only the compact audio track is sent to the provider whose key you entered. Captions stay in local browser storage unless you sign in and turn on encrypted sync."
                }
              },
              {
                "@type": "Question",
                "name": "Can I get captions for NotebookLM Audio Overview podcasts?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. LM Subs detects Audio Overview audio elements, including detached players inside shadow DOM, and renders captions in a caption dock with both host labels preserved."
